<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbridge Capital: Coming soon</title>
<meta name="description" content="Northbridge Capital is an independent proprietary trading firm. Our new website is coming soon.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Northbridge Capital">
<meta property="og:title" content="Northbridge Capital: Coming soon">
<meta property="og:description" content="Northbridge Capital is an independent proprietary trading firm. Our new website is coming soon.">
<meta property="og:image" content="https://northbridge-capital.com/coming-soon/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/coming-soon/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/coming-soon/apple-touch-icon.png">
<link rel="preload" href="/coming-soon/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:300 500;font-display:swap;src:url(/coming-soon/hanken-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--gut:clamp(20px,3.5vw,56px);--gap:16px;--scale:.85;--ease-out:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;zoom:var(--scale)}
body{margin:0;background:#000;color:#fff;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,p{margin:0}
.wrap{max-width:2000px;margin:0 auto;padding-inline:var(--gut)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:var(--gap)}
.page{position:relative;height:calc(100svh / var(--scale));min-height:560px;overflow:hidden}
.page::before{content:"";position:absolute;inset:0;z-index:2;background:#000;pointer-events:none;animation:unveil 1.4s ease .1s both}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.15) 30%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.78))}
.topbar{position:absolute;inset:0 0 auto 0;z-index:3;display:flex;align-items:center;height:72px}
.brand{display:inline-flex;align-items:baseline;gap:14px;font-size:22px;font-weight:500;letter-spacing:-.02em;color:#fff;text-decoration:none}
.brand-name{white-space:nowrap}
.tm{margin-left:2px;font-size:.42em;font-weight:400;line-height:1;vertical-align:top;position:relative;top:.35em;opacity:.8;letter-spacing:0}
.brand-div{position:relative;top:.023em;flex:none;width:1px;height:.7em;background:rgba(255,255,255,.4)}
.brand-sym{position:relative;top:.023em;display:block;flex:none;width:.7em;height:.7em}
.brand-sym i{position:absolute;inset:0;display:block}
.brand-sym i:nth-child(1){background:#8A8A86;clip-path:polygon(0.00% 13.64%,0.00% 100.00%,86.36% 100.00%,86.36% 100.00%)}
.brand-sym i:nth-child(2){background:#fff;clip-path:polygon(13.64% 0.00%,100.00% 0.00%,100.00% 86.36%,100.00% 86.36%)}
.foot{position:absolute;inset:auto 0 0 0;z-index:3;padding-bottom:var(--gut);align-items:last baseline}
h1{grid-column:1/-1;font-size:clamp(56px,10.5vw,176px);line-height:.92;letter-spacing:-.045em;font-weight:300;text-wrap:balance}
h1 span{display:block}
h1 span+span{margin-left:-.018em}
.note{grid-column:1/-1;font-size:clamp(18px,1.5vw,21px);line-height:1.45;font-weight:300;position:relative;margin-top:calc(var(--gap)*1.5)}
.note::before,.note::after{content:"";position:absolute;top:-.4em;bottom:-.4em;width:7px;border:1px solid currentColor}
.note::before{right:100%;margin-right:7px;border-right:0}
.note::after{left:100%;margin-left:7px;border-left:0}
@media (min-width:900px){.note{grid-column:8/13;margin-top:0}h1{grid-column:1/8}}
.in{animation:up .9s var(--ease-out) both}
.d2{animation-delay:.3s}.d3{animation-delay:.5s}
@keyframes up{from{opacity:0;translate:0 24px}}
@keyframes unveil{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.in,.page::before{animation:none!important}.page::before{opacity:0}}
</style>
</head>
<body>
<div class="page">
  <img class="poster" src="/coming-soon/hero-poster.jpg" alt="" width="1920" height="1080" fetchpriority="high">
  <div class="shade"></div>
  <header class="topbar wrap">
    <a class="brand" href="/" aria-label="Northbridge Capital"><span class="brand-name">Northbridge Capital<sup class="tm" aria-hidden="true">™</sup></span><span class="brand-div" aria-hidden="true"></span><span class="brand-sym" aria-hidden="true"><i></i><i></i></span></a>
  </header>
  <main class="foot wrap g12">
    <h1 class="in d2"><span>Coming</span><span>soon.</span></h1>
    <p class="note in d3">Northbridge Capital is an independent proprietary trading firm. We trade our own capital, guided by disciplined strategy, deep research, and rigorous risk management. Our new website is on its way.</p>
  </main>
</div>
</body>
</html>
