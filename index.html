<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Northbridge Capital</title>
		<meta
			name="description"
			content="Northbridge Capital is preparing a new public website."
		/>
		<style>
			:root {
				color-scheme: dark;
				--bg: #081018;
				--bg-2: #0f1c2b;
				--panel: rgba(10, 18, 28, 0.72);
				--panel-border: rgba(255, 255, 255, 0.12);
				--text: #f4f1ea;
				--muted: rgba(244, 241, 234, 0.72);
				--accent: #c6a96c;
				--accent-soft: rgba(198, 169, 108, 0.2);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			body {
				font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
				background:
					radial-gradient(circle at top, rgba(198, 169, 108, 0.14), transparent 35%),
					linear-gradient(135deg, var(--bg), var(--bg-2));
				color: var(--text);
			}

			body::before {
				content: "";
				position: fixed;
				inset: 0;
				pointer-events: none;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 72px 72px;
				mask-image: radial-gradient(circle at center, black, transparent 88%);
				opacity: 0.35;
			}

			main {
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 32px;
			}

			.card {
				width: min(760px, 100%);
				padding: clamp(28px, 5vw, 56px);
				border: 1px solid var(--panel-border);
				border-radius: 28px;
				background: var(--panel);
				backdrop-filter: blur(16px);
				box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
			}

			.kicker {
				margin: 0 0 18px;
				font-size: 0.8rem;
				letter-spacing: 0.3em;
				text-transform: uppercase;
				color: var(--accent);
			}

			h1 {
				margin: 0;
				font-size: clamp(2.8rem, 8vw, 6rem);
				line-height: 0.95;
				font-weight: 600;
				letter-spacing: -0.04em;
			}

			.lead {
				margin: 22px 0 0;
				max-width: 42rem;
				font-size: clamp(1.05rem, 2vw, 1.3rem);
				line-height: 1.7;
				color: var(--muted);
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				margin-top: 34px;
				padding: 12px 18px;
				border: 1px solid var(--panel-border);
				border-radius: 999px;
				background: var(--accent-soft);
				color: var(--text);
				font-size: 0.95rem;
			}

			.status::before {
				content: "";
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 6px rgba(198, 169, 108, 0.15);
			}

			footer {
				margin-top: 42px;
				padding-top: 18px;
				border-top: 1px solid rgba(255, 255, 255, 0.08);
				font-size: 0.9rem;
				color: rgba(244, 241, 234, 0.55);
			}

			@media (max-width: 640px) {
				main {
					padding: 20px;
				}

				.card {
					border-radius: 22px;
				}

				.status {
					width: 100%;
					justify-content: center;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section class="card" aria-labelledby="title">
				<p class="kicker">Northbridge Capital</p>
				<h1 id="title">Site coming soon.</h1>
				<p class="lead">
					We are rebuilding our public presence. The new website will be live here
					soon.
				</p>
				<div class="status" role="status" aria-live="polite">
					Preparing a new experience
				</div>
				<footer>Thank you for your patience.</footer>
			</section>
		</main>
	</body>
</html>
